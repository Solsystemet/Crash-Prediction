[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crash-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "pandas-stubs>=3.0.0.260204",
    "pandera>=0.29.0",
    "requests>=2.32.5",
    "scikit-learn>=1.6.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
    "types-requests>=2.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["data_preparation", "models", "training"]
