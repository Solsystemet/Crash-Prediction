[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crash-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "pandas-stubs>=3.0.0.260204",
    "pandera>=0.29.0",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
    "types-requests>=2.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["data_preparation", "models", "training"]

# PyTorch is installed manually (not managed by uv) for GPU compatibility:
# AMD (ROCm):  uv pip install torch torchvision --index-url https://download.pytorch.org/whl/rocm6.1
# NVIDIA:      uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cu124
