[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crash-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imbalanced-learn>=0.12.0",
    "imblearn>=0.0",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "pandas-stubs>=3.0.0.260204",
    "pandera>=0.29.0",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
    "types-requests>=2.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["data_preparation", "models", "training"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
